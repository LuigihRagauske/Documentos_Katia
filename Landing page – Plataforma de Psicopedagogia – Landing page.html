  <div id="__bundler_placeholder">Loading Plataforma de Psicopedagogia...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

on: none; color: #1F5C5A; border: 2px solid #1F5C5A; border-radius: 999px\">Cadastre-se<\u002Fa>\n<a href=\"#entrar\" style=\"min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center; padding: 0 20px; font-weight: 700; text-decoration: none; color: #FFFFFF; background: #1F5C5A; border-radius: 999px\">Entrar<\u002Fa>\n<\u002Fdiv>\n<\u002Fheader>\n\n<section id=\"top\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 48px; align-items: center; padding: 56px 6vw 72px; max-width: 1280px; margin: 0 auto\">\n<div>\n<div style=\"display: inline-block; padding: 6px 14px; background: #F6E3A8; color: #5A4300; font-size: 14px; font-weight: 700; border-radius: 999px\">Plataforma de cuidado psicopedagógico<\u002Fdiv>\n<h1 style=\"font-family: 'Fraunces', serif; font-size: clamp(38px, 5.5vw, 64px); line-height: 1.08; margin: 20px 0 16px; color: #1F5C5A\">Aprender fica mais leve quando alguém entende como você aprende.<\u002Fh1>\n<p style=\"font-size: 19px; margin: 0 0 28px; max-width: 520px\">A plataforma conecta famílias e psicopedagogas em um ambiente seguro e moderno, feito para o atendimento online de crianças, adolescentes e adultos com dificuldades de aprendizagem.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 14px; align-items: center\">\n<a href=\"#cadastro\" style=\"min-height: 52px; box-sizing: border-box; display: inline-flex; align-items: center; padding: 0 28px; font-size: 17px; font-weight: 700; text-decoration: none; color: #FFFFFF; background: #C4533D; border-radius: 999px\">Encontrar uma psicopedagoga<\u002Fa>\n<span style=\"font-size: 14px; font-weight: 600; color: #3F4E4C\">Conforme a LGPD · Sessões não gravadas<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"position: relative; min-height: 340px; background: #DCEBE6; border-radius: 32px; padding: 32px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end; gap: 16px\">\n<div style=\"position: absolute; top: 28px; right: 28px; width: 72px; height: 72px; border-radius: 50%; background: #F2B84B\"><\u002Fdiv>\n<div style=\"position: absolute; top: 90px; left: 32px; width: 44px; height: 44px; border-radius: 12px; background: #E2725B; transform: rotate(12deg)\"><\u002Fdiv>\n<div style=\"background: #FFFFFF; border-radius: 20px; padding: 20px 22px\">\n<div style=\"font-size: 13px; font-weight: 700; color: #1F5C5A; letter-spacing: 0.04em\">PRÓXIMA SESSÃO<\u002Fdiv>\n<div style=\"font-family: 'Fraunces', serif; font-size: 22px; margin-top: 4px\">Quinta, 15h · 50 minutos<\u002Fdiv>\n<div style=\"font-size: 15px; color: #3F4E4C\">Sala virtual no navegador, sem instalar nada<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background: #FFFFFF; border-radius: 20px; padding: 20px 22px; display: flex; justify-content: space-between; align-items: center; gap: 16px\">\n<div><div style=\"font-weight: 700\">[VALOR] por sessão<\u002Fdiv><div style=\"font-size: 14px; color: #3F4E4C\">Sem mensalidade e sem fidelidade<\u002Fdiv><\u002Fdiv>\n<div style=\"font-size: 13px; font-weight: 700; color: #1F5C5A; background: #DCEBE6; padding: 6px 12px; border-radius: 999px\">Online<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"como-funciona\" style=\"background: #FFFFFF; padding: 72px 6vw\">\n<div style=\"max-width: 1280px; margin: 0 auto\">\n<div style=\"font-size: 14px; font-weight: 700; color: #C4533D; letter-spacing: 0.06em\">COMO FUNCIONA<\u002Fdiv>\n<h2 style=\"font-family: 'Fraunces', serif; font-size: clamp(30px, 4vw, 44px); margin: 8px 0 12px; color: #1F5C5A\">Sua jornada em quatro passos<\u002Fh2>\n<p style=\"margin: 0 0 40px; max-width: 560px\">Do primeiro acesso ao acompanhamento contínuo, uma experiência simples para toda a família.<\u002Fp>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px\">\n<div style=\"padding: 24px; border-radius: 20px; background: #FBF7F0\"><div style=\"width: 44px; height: 44px; border-radius: 50%; background: #1F5C5A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700\">1<\u002Fdiv><h3 style=\"font-family: 'Fraunces', serif; font-size: 21px; margin: 16px 0 6px\">Escolha uma psicopedagoga<\u002Fh3><p style=\"margin: 0\">Explore perfis, formações e abordagens e encontre quem combina com a sua necessidade.<\u002Fp><\u002Fdiv>\n<div style=\"padding: 24px; border-radius: 20px; background: #FBF7F0\"><div style=\"width: 44px; height: 44px; border-radius: 50%; background: #1F5C5A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700\">2<\u002Fdiv><h3 style=\"font-family: 'Fraunces', serif; font-size: 21px; margin: 16px 0 6px\">Escolha um horário<\u002Fh3><p style=\"margin: 0\">Agende em poucos cliques, direto na agenda online, com confirmação imediata.<\u002Fp><\u002Fdiv>\n<div style=\"padding: 24px; border-radius: 20px; background: #FBF7F0\"><div style=\"width: 44px; height: 44px; border-radius: 50%; background: #1F5C5A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700\">3<\u002Fdiv><h3 style=\"font-family: 'Fraunces', serif; font-size: 21px; margin: 16px 0 6px\">Realize a sessão online<\u002Fh3><p style=\"margin: 0\">Atendimento em sala virtual integrada, com atividades e recursos para a criança.<\u002Fp><\u002Fdiv>\n<div style=\"padding: 24px; border-radius: 20px; background: #FBF7F0\"><div style=\"width: 44px; height: 44px; border-radius: 50%; background: #1F5C5A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700\">4<\u002Fdiv><h3 style=\"font-family: 'Fraunces', serif; font-size: 21px; margin: 16px 0 6px\">Acompanhe a evolução<\u002Fh3><p style=\"margin: 0\">Relatórios e histórico organizados para a família e, se desejado, para a escola.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"areas\" style=\"padding: 72px 6vw\">\n<div style=\"max-width: 1280px; margin: 0 auto\">\n<div style=\"font-size: 14px; font-weight: 700; color: #C4533D; letter-spacing: 0.06em\">ÁREAS DE ATUAÇÃO<\u002Fdiv>\n<h2 style=\"font-family: 'Fraunces', serif; font-size: clamp(30px, 4vw, 44px); margin: 8px 0 12px; color: #1F5C5A\">Cuidado especializado para cada jeito de aprender<\u002Fh2>\n<p style=\"margin: 0 0 40px; max-width: 600px\">Profissionais preparadas para investigar, intervir e acompanhar o processo de aprendizagem com escuta e método.<\u002Fp>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px\">\n<div style=\"background: #FFFFFF; border-radius: 20px; padding: 22px; border-top: 6px solid #E2725B\"><h3 style=\"font-family: 'Fraunces', serif; font-size: 20px; margin: 0 0 6px\">Dificuldades de aprendizagem<\u002Fh3><p style=\"margin: 0; font-size: 15px\">Avaliação e intervenção para quem encontra obstáculos ao aprender.<\u002Fp><\u002Fdiv>\n<div style=\"background: #FFFFFF; border-radius: 20px; padding: 22px; border-top: 6px solid #F2B84B\"><h3 style=\"font-family: 'Fraunces', serif; font-size: 20px; margin: 0 0 6px\">Dislexia e discalculia<\u002Fh3><p style=\"margin: 0; font-size: 15px\">Estratégias para leitura, escrita e raciocínio matemático.<\u002Fp><\u002Fdiv>\n<div style=\"background: #FFFFFF; border-radius: 20px; padding: 22px; border-top: 6px solid #1F5C5A\"><h3 style=\"font-family: 'Fraunces', serif; font-size: 20px; margin: 0 0 6px\">TDAH<\u002Fh3><p style=\"margin: 0; font-size: 15px\">Apoio para foco, organização, rotina de estudos e autonomia.<\u002Fp><\u002Fdiv>\n<div style=\"background: #FFFFFF; border-radius: 20px; padding: 22px; border-top: 6px solid #E2725B\"><h3 style=\"font-family: 'Fraunces', serif; font-size: 20px; margin: 0 0 6px\">TEA<\u002Fh3><p style=\"margin: 0; font-size: 15px\">Acompanhamento sensível ao neurodesenvolvimento e à comunicação singular.<\u002Fp><\u002Fdiv>\n<div style=\"background: #FFFFFF; border-radius: 20px; padding: 22px; border-top: 6px solid #F2B84B\"><h3 style=\"font-family: 'Fraunces', serif; font-size: 20px; margin: 0 0 6px\">Alfabetização<\u002Fh3><p style=\"margin: 0; font-size: 15px\">Apoio no processo de leitura e escrita nos anos iniciais.<\u002Fp><\u002Fdiv>\n<div style=\"background: #FFFFFF; border-radius: 20px; padding: 22px; border-top: 6px solid #1F5C5A\"><h3 style=\"font-family: 'Fraunces', serif; font-size: 20px; margin: 0 0 6px\">Orientação de estudos<\u002Fh3><p style=\"margin: 0; font-size: 15px\">Métodos, planejamento e hábitos para estudar com mais confiança.<\u002Fp><\u002Fdiv>\n<div style=\"background: #FFFFFF; border-radius: 20px; padding: 22px; border-top: 6px solid #E2725B\"><h3 style=\"font-family: 'Fraunces', serif; font-size: 20px; margin: 0 0 6px\">Apoio escolar<\u002Fh3><p style=\"margin: 0; font-size: 15px\">Orientação à família e à escola sobre adaptações e acompanhamento.<\u002Fp><\u002Fdiv>\n<div style=\"background: #FFFFFF; border-radius: 20px; padding: 22px; border-top: 6px solid #F2B84B\"><h3 style=\"font-family: 'Fraunces', serif; font-size: 20px; margin: 0 0 6px\">Autoestima e motivação<\u002Fh3><p style=\"margin: 0; font-size: 15px\">Reconstrução da relação com o aprender e com a própria capacidade.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"plataforma\" style=\"background: #1F5C5A; color: #FFFFFF; padding: 72px 6vw\">\n<div style=\"max-width: 1280px; margin: 0 auto\">\n<div style=\"font-size: 14px; font-weight: 700; color: #F2B84B; letter-spacing: 0.06em\">A PLATAFORMA<\u002Fdiv>\n<h2 style=\"font-family: 'Fraunces', serif; font-size: clamp(30px, 4vw, 44px); margin: 8px 0 40px\">Tudo em um só lugar, para famílias e profissionais<\u002Fh2>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 28px\">\n<div style=\"background: rgba(255,255,255,0.08); border-radius: 24px; padding: 28px\">\n<h3 style=\"font-family: 'Fraunces', serif; font-size: 26px; margin: 0 0 16px\">Para famílias<\u002Fh3>\n<ul style=\"margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px\">\n<li>Atendimento por vídeo, no navegador<\u002Fli>\n<li>Agenda simples com confirmação imediata<\u002Fli>\n<li>Pagamento seguro com recibo digital<\u002Fli>\n<li>Chat com a psicopedagoga entre as sessões<\u002Fli>\n<li>Relatórios de evolução e atividades para casa<\u002Fli>\n<li>Consentimento do responsável sobre os dados do menor<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<div style=\"background: rgba(255,255,255,0.08); border-radius: 24px; padding: 28px\">\n<h3 style=\"font-family: 'Fraunces', serif; font-size: 26px; margin: 0 0 16px\">Para psicopedagogas<\u002Fh3>\n<ul style=\"margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px\">\n<li>Perfil profissional público com formação e abordagens<\u002Fli>\n<li>Agenda online com bloqueios e janelas de atendimento<\u002Fli>\n<li>Prontuário digital: anamnese, avaliação e plano de intervenção<\u002Fli>\n<li>Biblioteca de atividades e jogos para as sessões<\u002Fli>\n<li>Gestão de pacientes, etiquetas e lembretes<\u002Fli>\n<li>Recebimentos com extrato claro e painel de métricas<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"seguranca\" style=\"padding: 72px 6vw\">\n<div style=\"max-width: 1280px; margin: 0 auto\">\n<div style=\"font-size: 14px; font-weight: 700; color: #C4533D; letter-spacing: 0.06em\">SEGURANÇA<\u002Fdiv>\n<h2 style=\"font-family: 'Fraunces', serif; font-size: clamp(30px, 4vw, 44px); margin: 8px 0 40px; color: #1F5C5A\">Confiança em cada detalhe<\u002Fh2>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px\">\n<div><h3 style=\"font-family: 'Fraunces', serif; font-size: 21px; margin: 0 0 6px\">Sem gravação da sessão<\u002Fh3><p style=\"margin: 0\">As conversas acontecem ao vivo e não são gravadas.<\u002Fp><\u002Fdiv>\n<div><h3 style=\"font-family: 'Fraunces', serif; font-size: 21px; margin: 0 0 6px\">Proteção dos dados<\u002Fh3><p style=\"margin: 0\">Informações tratadas com padrões rigorosos de segurança.<\u002Fp><\u002Fdiv>\n<div><h3 style=\"font-family: 'Fraunces', serif; font-size: 21px; margin: 0 0 6px\">Conformidade com a LGPD<\u002Fh3><p style=\"margin: 0\">Inclui o cuidado específico com dados de crianças e adolescentes.<\u002Fp><\u002Fdiv>\n<div><h3 style=\"font-family: 'Fraunces', serif; font-size: 21px; margin: 0 0 6px\">Privacidade<\u002Fh3><p style=\"margin: 0\">Ambiente reservado entre a família e a profissional.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"faq\" style=\"background: #FFFFFF; padding: 72px 6vw\">\n<div style=\"max-width: 820px; margin: 0 auto\">\n<h2 style=\"font-family: 'Fraunces', serif; font-size: clamp(30px, 4vw, 44px); margin: 0 0 32px; color: #1F5C5A\">Ainda tem dúvidas?<\u002Fh2>\n<details style=\"border-bottom: 1px solid #E3DCCD; padding: 16px 0\"><summary style=\"font-weight: 700; font-size: 18px\">Como funciona o atendimento?<\u002Fsummary><p style=\"margin: 10px 0 0\">Os atendimentos acontecem online, em uma sala virtual integrada. Você escolhe a profissional, agenda um horário e realiza a sessão pelo navegador.<\u002Fp><\u002Fdetails>\n<details style=\"border-bottom: 1px solid #E3DCCD; padding: 16px 0\"><summary style=\"font-weight: 700; font-size: 18px\">Atende crianças?<\u002Fsummary><p style=\"margin: 10px 0 0\">Sim. O cadastro é feito pelo responsável, que acompanha o processo e autoriza o tratamento dos dados da criança ou do adolescente.<\u002Fp><\u002Fdetails>\n<details style=\"border-bottom: 1px solid #E3DCCD; padding: 16px 0\"><summary style=\"font-weight: 700; font-size: 18px\">Como funciona o pagamento?<\u002Fsummary><p style=\"margin: 10px 0 0\">O pagamento é feito online, a cada sessão agendada, sem mensalidade. O valor vigente é sempre o exibido no momento do agendamento. [DEFINIR POLÍTICA DE CANCELAMENTO]<\u002Fp><\u002Fdetails>\n<details style=\"border-bottom: 1px solid #E3DCCD; padding: 16px 0\"><summary style=\"font-weight: 700; font-size: 18px\">As sessões são gravadas?<\u002Fsummary><p style=\"margin: 10px 0 0\">Não. As sessões acontecem ao vivo e não são gravadas, preservando o sigilo.<\u002Fp><\u002Fdetails>\n<details style=\"border-bottom: 1px solid #E3DCCD; padding: 16px 0\"><summary style=\"font-weight: 700; font-size: 18px\">Como me torno psicopedagoga na plataforma?<\u002Fsummary><p style=\"margin: 10px 0 0\">Basta se cadastrar, montar seu perfil profissional e passar a receber pacientes com agenda, prontuário e recebimentos integrados.<\u002Fp><\u002Fdetails>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"cadastro\" style=\"padding: 72px 6vw; text-align: center\">\n<div style=\"max-width: 760px; margin: 0 auto; background: #F6E3A8; border-radius: 32px; padding: 56px 28px\">\n<h2 style=\"font-family: 'Fraunces', serif; font-size: clamp(30px, 4vw, 44px); margin: 0 0 12px; color: #4A3700\">Sua jornada começa hoje<\u002Fh2>\n<p style=\"margin: 0 0 28px; color: #4A3700\">Encontre uma psicopedagoga ou faça parte da plataforma.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 14px; justify-content: center\">\n<a href=\"#entrar\" style=\"min-height: 52px; box-sizing: border-box; display: inline-flex; align-items: center; padding: 0 28px; font-weight: 700; text-decoration: none; color: #FFFFFF; background: #1F5C5A; border-radius: 999px\">Encontrar psicopedagoga<\u002Fa>\n<a href=\"#entrar\" style=\"min-height: 52px; box-sizing: border-box; display: inline-flex; align-items: center; padding: 0 28px; font-weight: 700; text-decoration: none; color: #1F5C5A; border: 2px solid #1F5C5A; border-radius: 999px\">Quero ser profissional<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"background: #1B2A29; color: #D7E3E0; padding: 40px 6vw; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 24px; font-size: 14px\">\n<div style=\"max-width: 360px\"><div style=\"font-family: 'Fraunces', serif; font-size: 20px; color: #FFFFFF\">[NOME DA PLATAFORMA]<\u002Fdiv><p style=\"margin: 8px 0 0\">Psicopedagogia online em um ambiente seguro e moderno.<\u002Fp><\u002Fdiv>\n<div style=\"display: flex; gap: 20px; align-items: flex-start\"><a href=\"#politica\" style=\"color: #D7E3E0\">Política de Privacidade<\u002Fa><a href=\"#termos\" style=\"color: #D7E3E0\">Termos de Uso<\u002Fa><\u002Fdiv>\n<div style=\"width: 100%\">© 2026 [NOME DA INSTITUIÇÃO] · [CRP / REGISTRO PROFISSIONAL]<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1360,&quot;height&quot;:3400}}\">\nclass Component extends DCLogic {\nrenderVals() {\nreturn {};\n}\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
